<html lang="en">
<head>
<meta charset="utf-8" />

<title>Photo Tagger</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel2: #20242d;
    --panel3: #262b36;
    --border: #2a2f3a;
    --text: #e8eaed;

  * { box-sizing: border-box; }
  html, body {

    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13.5px;
  }
  header {

    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  header h1 { font-size: 14.5px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12.5px; cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  header button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; }
  header .pending-badge {
    background: var(--accent2); color: #1a1300;
    border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700;
  }

    grid-template-columns: 280px 1fr 380px;
    height: calc(100vh - 47px);
    min-height: 0;

  aside.grid {

    overflow-y: auto; padding: 8px;

  aside.grid .search {

    background: var(--panel2); color: var(--text);

  .thumb {

  .thumb.active { background: var(--panel2); outline: 1px solid var(--accent); }

  .thumb .label .badge {

  .thumb .label .badge.pair { background: #3a2f5a; color: #d8c5ff; }

  section.image {

    border-right: 1px solid var(--border);

  .image-area {

  .image-wrap {

  .chip {

    background: var(--accent); color: #0b1020;

  .chip.removed {
    background: var(--removed); color: #ffb3b3;

  }
  .chip button {
    background: transparent; border: 0; color: inherit; cursor: pointer;
    font-size: 13px; padding: 0; line-height: 1; opacity: 0.7;

  .chip button:hover { opacity: 1; }

  .autocomplete { position: relative; margin-top: 10px; }
  .autocomplete input {
    width: 100%; padding: 7px 10px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    font: inherit;
  }
  .autocomplete .results {
    position: absolute; left: 0; right: 0; top: 100%;
    background: var(--panel3); border: 1px solid var(--border);
    border-top: 0; border-radius: 0 0 6px 6px; max-height: 220px;

  }
  .autocomplete .results.show { display: block; }
  .autocomplete .results div {
    padding: 6px 10px; cursor: pointer; font-size: 12.5px;
  }
  .autocomplete .results div.focus, .autocomplete .results div:hover {
    background: var(--panel2);
  }
  .autocomplete .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }

  .date-row {
    display: grid;
    grid-template-columns: 70px 1fr 60px;
    gap: 6px;
  }
  .date-row .date-input {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit;
  }
  .date-row select.date-input { padding: 5px 6px; }
  textarea.caption-edit {
    width: 100%; min-height: 60px;
    padding: 7px 10px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font: inherit; resize: vertical;
  }
  .marker-list { display: flex; flex-direction: column; gap: 4px; }
  .marker-row {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel2); border-radius: 6px;
    padding: 5px 8px; font-size: 12px;
  }
  .marker-row .dot {
    background: var(--accent); color: #0b1020;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 10.5px; flex-shrink: 0;
  }
  .marker-row.added .dot { background: #6fcf97; color: #0a1a0e; }
  .marker-row .person { flex: 1; word-break: break-word; }
  .marker-row .pos { color: var(--muted); font-size: 10.5px; }
  .marker-row .x {
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; opacity: 0.7; font-size: 13px;
  }
  .marker-row .x:hover { opacity: 1; color: var(--danger); }
</style>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const STORAGE_KEY = 'photo-tagger-edits-v2';

// edits[id] = {
//   add: Set<string>, remove: Set<string>,
//   markers_add: [{person,x,y,face}],

        add: new Set(v.add || []),
        remove: new Set(v.remove || []),
        markers_add: v.markers_add || [],
        markers_remove: new Set(v.markers_remove || []),
        rotation: v.rotation ?? null,
        rotation_back: v.rotation_back ?? null,
        date: v.date != null ? v.date : undefined,
        caption: v.caption ?? null,

      markers_remove: [...v.markers_remove],
      rotation: v.rotation,
      rotation_back: v.rotation_back,
      date: v.date != null ? v.date : undefined,
      caption: v.caption,

let selectedId = null;
let currentFace = 'front';
let tagMode = false;
let currentFilter = 'all';

function ensureEdit(id) {

    markers_add: [], markers_remove: new Set(),

    // wrap.getBoundingClientRect() returns the AABB AFTER the parent's
    // rotate(). But for the natural-frame math we need the center of the
    // image — which is the center of the wrap, regardless of rotation.
    const wr = wrap.getBoundingClientRect();
    const cx = wr.left + wr.width / 2;
    const cy = wr.top + wr.height / 2;
    // Screen-space displacement from center
    const dx = ev.clientX - cx;
    const dy = ev.clientY - cy;
    // Inverse-rotate (CSS rotates CW; to invert we rotate CCW by rot)
    const rotDeg = effectiveRotation(photo, currentFace);
    const rad = -rotDeg * Math.PI / 180;
    const cs = Math.cos(rad), sn = Math.sin(rad);
    const ux = dx * cs - dy * sn;
    const uy = dx * sn + dy * cs;
    // The unrotated displayed image's local size is img.offsetWidth × offsetHeight
    const w = img.offsetWidth || img.naturalWidth;
    const h = img.offsetHeight || img.naturalHeight;
    const fx = ux / w + 0.5;
    const fy = uy / h + 0.5;
    // Clamp to [0,1] just in case of edge clicks
    const cl = v => Math.max(0, Math.min(1, v));
    promptMarkerPerson(photo.id, cl(fx), cl(fy));
  });
  // Click a marker to remove
  area.querySelectorAll('.marker').forEach((el, idx) => {
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      const e = ensureEdit(photo.id);
      const m = markers[idx];
      if (m._state === 'added') {
        // remove from markers_add
        const realIdx = e.markers_add.indexOf(m._raw || null);
        const filt = e.markers_add.filter(x => !(x.x === m.x && x.y === m.y && x.person === m.person));
        e.markers_add = filt;
      } else {
        e.markers_remove.add(m._idx);
      }
      saveEdits();
      renderImage(); renderPanel(); renderThumbs();
    });
  });
}

function promptMarkerPerson(photoId, x, y) {
  // Inline mini-prompt: render a temporary autocomplete near the right-panel input.
  // Easiest: focus the right-panel autocomplete and stash a pending position.
  pendingMarker = { photoId, x, y };
  const inp = document.getElementById('ac-input');
  if (inp) { inp.placeholder = `Pick person for marker @ ${(x*100).toFixed(0)}%,${(y*100).toFixed(0)}% …`; inp.focus(); }
}
let pendingMarker = null;

function renderPanel() {
  const panel = document.getElementById('panel');
  const photo = DATA.photos.find(p => p.id === selectedId);
  if (!photo) {
    panel.innerHTML = '<div class="image-empty" style="margin-top:24px">No photo selected.</div>';
    return;
  }
  const e = ensureEdit(photo.id);
  // chips: existing tags + removed (strikethrough) + added (green)
  const chipHtml = [];
  for (const t of photo.tags) {
    if (e.remove.has(t)) {
      chipHtml.push(`<span class="chip removed" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<button title="Undo remove" data-action="undo-remove">↺</button></span>`);
    } else {
      chipHtml.push(`<span class="chip" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<button title="Remove tag" data-action="remove">×</button></span>`);
    }
  }
  for (const t of e.add) {
    chipHtml.push(`<span class="chip added" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<button title="Undo add" data-action="undo-add">×</button></span>`);
  }

  // markers list
  const markers = effectiveMarkers(photo);
  const markerListHtml = markers.length ? markers.map((m, i) => `
    <div class="marker-row ${m._state === 'added' ? 'added' : ''}">
      <span class="dot">${i + 1}</span>
      <span class="person">${escapeHtml(m.person || '—')}</span>
      <span class="pos">${(m.x*100).toFixed(0)},${(m.y*100).toFixed(0)}</span>
      <button class="x" data-marker-idx="${i}" title="Remove marker">×</button>
    </div>
  `).join('') : '<div class="meta-row">No positional markers. Toggle <strong>Tag mode</strong> and click the image to drop one.</div>';

  panel.innerHTML = `
    <h2>${escapeHtml(photo.title)}</h2>
    <div class="meta-row">
      <code>${escapeHtml(photo.folder + '/' + photo.title)}</code>
      ${photo.sidecar ? `<br/>sidecar: <code>${escapeHtml(photo.sidecar)}</code>` : ''}
      ${photo.type ? `<br/>type: <code>${escapeHtml(photo.type)}</code>` : ''}
    </div>

    <h3>People in this photo</h3>
    <div class="chips" id="chips">${chipHtml.join('')}</div>
    <div class="autocomplete">
      <input id="ac-input" type="text" placeholder="+ Add person — start typing…" autocomplete="off"/>
      <div class="results" id="ac-results"></div>
      <div class="hint">From <code>people/</code> (${DATA.people.length} entries). Enter to pick.</div>
    </div>

    <h3>Date</h3>
    <div class="date-row">
      <input id="date-y" class="date-input" type="number" placeholder="YYYY" min="1700" max="2100" value="${escapeHtml(effectiveDate(photo).y)}"/>
      <select id="date-m" class="date-input">
        <option value="">— month —</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
      <input id="date-d" class="date-input" type="number" placeholder="DD" min="1" max="31" value="${escapeHtml(effectiveDate(photo).d)}"/>
    </div>
    <div class="hint">Any precision OK — year alone, or year + month, or year + month + day. Stored as <code>YYYY-MM-DD</code> / <code>YYYY-MM</code> / <code>YYYY</code>.</div>
    <div class="meta-row" style="margin-top:4px">Currently saved: <code id="date-preview">${escapeHtml(effectiveDateStr(photo) || '(none)')}</code></div>

    <h3>Positional markers</h3>
    <div class="marker-list" id="marker-list">${markerListHtml}</div>

    <h3>Caption / Notes</h3>
    <textarea id="caption-edit" class="caption-edit" placeholder="Add a caption or correction…">${escapeHtml(e.caption ?? '')}</textarea>
  `;

  // Wire chips
  panel.querySelector('#chips').addEventListener('click', ev => {
    const btn = ev.target.closest('button'); if (!btn) return;
    const chip = btn.closest('.chip'); const tag = chip.dataset.tag;
    const ee = ensureEdit(photo.id);
    const action = btn.dataset.action;
    if (action === 'remove') ee.remove.add(tag);
    else if (action === 'undo-remove') ee.remove.delete(tag);
    else if (action === 'undo-add') ee.add.delete(tag);
    saveEdits(); renderPanel(); renderThumbs(); renderImage();
  });

  // Wire marker removal
  panel.querySelector('#marker-list').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-marker-idx]'); if (!b) return;
    const idx = parseInt(b.dataset.markerIdx, 10);
    const m = markers[idx];
    const ee = ensureEdit(photo.id);
    if (m._state === 'added') {
      ee.markers_add = ee.markers_add.filter(x => !(x.x === m.x && x.y === m.y && x.person === m.person));
    } else {
      ee.markers_remove.add(m._idx);
    }
    saveEdits(); renderPanel(); renderImage(); renderThumbs();
  });

  // Wire caption
  panel.querySelector('#caption-edit').addEventListener('input', ev => {
    const ee = ensureEdit(photo.id);
    ee.caption = ev.target.value || null;
    saveEdits(); renderThumbs();
  });

  // Wire date inputs — set the month select to current value, then listen
  const dY = panel.querySelector('#date-y');
  const dM = panel.querySelector('#date-m');
  const dD = panel.querySelector('#date-d');
  const dPreview = panel.querySelector('#date-preview');
  const curDate = effectiveDate(photo);
  if (curDate.m) dM.value = curDate.m;
  function pushDate() {
    const ee = ensureEdit(photo.id);
    const newStr = joinDate(dY.value.trim(), dM.value, dD.value.trim());
    // Only mark as edit if value actually changed from saved YAML
    if (newStr === (photo.date || '')) {
      ee.date = undefined;        // unset: not a pending change
      delete ee.date;
    } else {
      ee.date = newStr;
    }
    dPreview.textContent = newStr || '(none)';
    saveEdits(); renderThumbs();
  }
  [dY, dM, dD].forEach(el => el.addEventListener('input', pushDate));
  dM.addEventListener('change', pushDate);

  // Wire autocomplete
  const ac = panel.querySelector('#ac-input');
  const acResults = panel.querySelector('#ac-results');
  let focusIdx = -1;
  function updateResults() {
    const q = ac.value.trim().toLowerCase();
    if (!q) { acResults.classList.remove('show'); acResults.innerHTML = ''; return; }
    const ee = ensureEdit(photo.id);
    const present = new Set(photo.tags.filter(t => !ee.remove.has(t)));
    for (const t of ee.add) present.add(t);
    const matches = DATA.people.filter(p => p.toLowerCase().includes(q) && !present.has(p)).slice(0, 20);
    if (!matches.length) { acResults.classList.remove('show'); return; }
    acResults.innerHTML = matches.map((m, i) =>
      `<div data-name="${escapeHtml(m)}" class="${i===0?'focus':''}">${escapeHtml(m)}</div>`).join('');
    acResults.classList.add('show');
    focusIdx = 0;
  }
  function pickPerson(name) {
    const ee = ensureEdit(photo.id);
    if (pendingMarker && pendingMarker.photoId === photo.id) {
      ee.markers_add.push({ person: name, x: pendingMarker.x, y: pendingMarker.y, face: 'front' });
      pendingMarker = null;
      ac.placeholder = '+ Add person — start typing…';
    } else {
      if (photo.tags.includes(name)) ee.remove.delete(name);
      else ee.add.add(name);
    }
    saveEdits();
    ac.value = '';
    acResults.classList.remove('show');
    renderPanel(); renderImage(); renderThumbs();
  }
  ac.addEventListener('input', updateResults);
  ac.addEventListener('keydown', ev => {
    const items = [...acResults.querySelectorAll('div')];
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      if (!items.length) return;
      focusIdx = (focusIdx + 1) % items.length;
      items.forEach((el, i) => el.classList.toggle('focus', i === focusIdx));
      items[focusIdx].scrollIntoView({block:'nearest'});
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (!items.length) return;
      focusIdx = (focusIdx - 1 + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle('focus', i === focusIdx));
      items[focusIdx].scrollIntoView({block:'nearest'});
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (focusIdx >= 0 && items[focusIdx]) pickPerson(items[focusIdx].dataset.name);
    } else if (ev.key === 'Escape') {
      acResults.classList.remove('show');
      if (pendingMarker) { pendingMarker = null; ac.placeholder = '+ Add person — start typing…'; }
    }
  });
  acResults.addEventListener('click', ev => {
    const d = ev.target.closest('div[data-name]');
    if (d) pickPerson(d.dataset.name);
  });
}

// Header buttons
document.getElementById('search').addEventListener('input', renderThumbs);
document.querySelectorAll('.filter').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    currentFilter = b.dataset.filter;
    renderThumbs();
  });
});
document.getElementById('rotate-l').addEventListener('click', () => rotateBy(-90));
document.getElementById('rotate-r').addEventListener('click', () => rotateBy(90));
function rotateBy(delta) {
  if (!selectedId) return;
  const photo = DATA.photos.find(p => p.id === selectedId);
  const e = ensureEdit(photo.id);
  const cur = effectiveRotation(photo, currentFace);
  const next = ((cur + delta) % 360 + 360) % 360;
  if (currentFace === 'front') e.rotation = next;
  else e.rotation_back = next;
  saveEdits();
  renderImage();
  renderThumbs();
}
document.getElementById('tag-mode').addEventListener('click', () => {
  tagMode = !tagMode;
  renderImage();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  if (!confirm('Clear all pending edits? This cannot be undone.')) return;
  edits = {}; saveEdits();
  renderThumbs(); renderImage(); renderPanel();
});

document.getElementById('export-btn').addEventListener('click', () => {
  const out = { schema: 'photo-tagger/v2', exported_at: new Date().toISOString(), edits: [] };
  for (const p of DATA.photos) {
    const e = edits[p.id]; if (!e || !isDirty(p.id)) continue;
    out.edits.push({
      photo: p.id,
      sidecar: p.sidecar,
      tag_field: p.tag_field,
      add: [...e.add],
      remove: [...e.remove],
      markers_add: e.markers_add,
      markers_remove: [...e.markers_remove],
      rotation: e.rotation,
      rotation_back: e.rotation_back,
      date: e.date != null ? e.date : null,
      caption: e.caption,
    });
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `photo-tagger-changes-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

renderThumbs();
</script>
</body>
</html>
